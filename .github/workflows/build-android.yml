name: Build Android APK

# 触发条件：推送到 main 分支、手动触发、打 tag
on:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'  # 按需调整为你本地的 Flutter 版本

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 打印 Flutter 版本
        run: flutter --version

      - name: 安装依赖
        working-directory: app
        run: flutter pub get

      - name: 静态分析（可选，发现明显错误）
        working-directory: app
        run: flutter analyze --no-fatal-infos || true

      - name: 注入签名密钥库
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/app/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/release.jks
            echo "✅ 已从 Secrets 恢复 release.jks"
          else
            echo "⚠️ 未配置 KEYSTORE_BASE64，将使用 debug 签名打包（仅用于测试，不可上架）"
          fi

      - name: 构建 Release APK
        working-directory: app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
