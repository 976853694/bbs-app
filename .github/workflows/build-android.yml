name: Build Android APK (未签名)

# 触发条件：推送到 main 分支、手动触发、打 tag
on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'  # 按需调整为你本地的 Flutter 版本

jobs:
  build-android:
    name: Build Android APK (未签名)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 打印 Flutter 版本
        run: flutter --version

      - name: 安装依赖
        run: flutter pub get

      - name: 静态分析（可选，发现明显错误）
        run: flutter analyze --no-fatal-infos || true

      # 默认无证书：不注入任何密钥库，直接构建未签名 APK。
      # 产物 app-release-unsigned.apk 需自行用 apksigner/jarsigner 签名后安装或上架。
      - name: 构建未签名 Release APK
        run: flutter build apk --release --split-per-abi

      - name: 上传 APK 产物（未签名）
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-unsigned
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30
