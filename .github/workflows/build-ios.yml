name: Build iOS (未签名)

# 触发条件：推送到 main 分支、手动触发、打 tag
on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'  # 按需调整

jobs:
  build-ios:
    name: Build iOS (未签名)
    runs-on: macos-14

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 打印 Flutter 版本
        run: flutter --version

      - name: 安装依赖
        working-directory: app
        run: flutter pub get

      - name: 静态分析（可选）
        working-directory: app
        run: flutter analyze --no-fatal-infos || true

      # 默认无证书：使用 --no-codesign 构建，不做任何签名。
      # 产物 Runner.app 为未签名应用，需自行用 codesign + 证书重签后打包成 ipa。
      - name: 构建未签名 Release 应用
        working-directory: app
        run: flutter build ios --release --no-codesign

      # 把未签名的 Runner.app 打包成未签名 .ipa（方便传输/重签工具处理）。
      # 注意：未签名 ipa 无法直接安装，必须先用你的证书重签。
      - name: 打包为未签名 IPA
        working-directory: app
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p build/ios/ipa
            PAYLOAD="build/ios/ipa/Payload"
            rm -rf "$PAYLOAD"
            mkdir -p "$PAYLOAD"
            cp -R "$APP_PATH" "$PAYLOAD/Runner.app"
            cd build/ios/ipa
            zip -qry "Runner-unsigned.ipa" Payload
            rm -rf Payload
            echo "✅ 已生成未签名 ipa：build/ios/ipa/Runner-unsigned.ipa"
          else
            echo "⚠️ 未找到 $APP_PATH，仅上传 .app"
          fi

      - name: 上传 IPA 产物（未签名）
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: |
            app/build/ios/ipa/*.ipa
            app/build/ios/iphoneos/Runner.app
          retention-days: 30
