name: Build iOS IPA

# 触发条件：推送到 main 分支、手动触发、打 tag
on:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      export_method:
        description: '导出方式（app-store / ad-hoc / development）'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc
          - app-store
          - development

env:
  FLUTTER_VERSION: '3.24.0'  # 按需调整

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 打印 Flutter 版本
        run: flutter --version

      - name: 安装依赖
        working-directory: app
        run: flutter pub get

      - name: 静态分析（可选）
        working-directory: app
        run: flutter analyze --no-fatal-infos || true

      # ===== 导入签名证书与描述文件 =====
      - name: 导入证书 (.p12) 到钥匙串
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "⚠️ 未配置 IOS_P12_BASE64，将尝试使用无签名构建"
          else
            # 创建临时钥匙串
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            security create-keychain -p "" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "" "$KEYCHAIN_PATH"

            # 解码并导入 p12
            P12_PATH="$RUNNER_TEMP/cert.p12"
            echo "$P12_BASE64" | base64 --decode > "$P12_PATH"
            security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
            echo "✅ 证书导入成功"
          fi

      - name: 导入描述文件 (.mobileprovision)
        env:
          PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          if [ -z "$PROVISION_BASE64" ]; then
            echo "⚠️ 未配置 IOS_PROVISION_BASE64"
          else
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
            echo "✅ 描述文件导入成功"
          fi

      # ===== 构建 IPA =====
      - name: 生成 ExportOptions.plist
        working-directory: app
        env:
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'ad-hoc' }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "✅ 已生成 ExportOptions.plist（method=${EXPORT_METHOD}）"

      - name: 构建 Release IPA
        working-directory: app
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            app/build/ios/ipa/*.ipa
            app/build/ios/archive/Runner.xcarchive
          retention-days: 30
