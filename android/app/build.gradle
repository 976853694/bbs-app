plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

// ===== 签名配置：从环境变量读取（CI 打包用），本地无签名时回退 debug 签名 =====
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def hasReleaseSigning = keystorePropertiesFile.exists() || System.getenv("KEYSTORE_BASE64") != null

def keystorePath = keystoreProperties.getProperty('storeFile')
    ?: (System.getenv("KEYSTORE_PATH") ?: file('keystore/release.jks').absolutePath)
def keystorePassword = keystoreProperties.getProperty('storePassword') ?: System.getenv("KEYSTORE_PASSWORD")
def keyAlias = keystoreProperties.getProperty('keyAlias') ?: System.getenv("KEY_ALIAS")
def keyPassword = keystoreProperties.getProperty('keyPassword') ?: System.getenv("KEY_PASSWORD")

android {
    namespace "com.example.community_forum"
    compileSdk 34

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.community_forum"
        minSdk 21
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
